{% extends "base.html" %}

{% block title %}
{{ house.title }}
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">

            <img src="{{ url_for('static',
                filename='uploads/' + house.image) }}"
                class="img-fluid rounded shadow">

        </div>

        <div class="col-md-6">

            <h2>{{ house.title }}</h2>

            <h4 class="text-success">
                {{ house.price }} ETB
            </h4>

            <hr>

            <p>
                <strong>City:</strong>
                {{ house.city }}
            </p>

            <p>
                <strong>Bedrooms:</strong>
                {{ house.bedrooms }}
            </p>

            <p>
                <strong>Bathrooms:</strong>
                {{ house.bathrooms }}
            </p>

            <p>
                <strong>Description:</strong>
            </p>

            <p>
                {{ house.description }}
            </p>

            <a href="https://wa.me/251911111111"
                class="btn btn-success">
                WhatsApp Seller
            </a>

        </div>

    </div>

</div>

{% endblock %}
