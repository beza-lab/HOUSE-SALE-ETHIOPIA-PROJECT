{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-4">

        <div class="card shadow">

            <div class="card-header">
                <h3>Login</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <input
                        class="form-control mb-3"
                        name="username"
                        placeholder="Username">

                    <input
                        class="form-control mb-3"
                        type="password"
                        name="password"
                        placeholder="Password">

                    <button class="btn btn-success">
                        Login
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
